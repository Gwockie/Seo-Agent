# Synthetic test environment only. Never point this compose project at a live volume.
services:
  db:
    image: mariadb:11.4@sha256:1292844148b311e4ed4300022a996d39083f415a963e970cf47cad1b3b18e3a6
    environment:
      MARIADB_ROOT_PASSWORD: synthetic-local-only
      MARIADB_DATABASE: wordpress
    tmpfs:
      - /var/lib/mysql
  wordpress:
    image: wordpress:php8.3-apache@sha256:f32ffa85064d9c951b7b69c929fa2a9f682aa4443e0c0a56ac2000499cb64383
    ports:
      - "127.0.0.1:8879:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: synthetic-local-only
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('LSEO_INSTANCE', 'synthetic-local-wordpress');
        define('LSEO_ENVIRONMENT', 'local');
        define('LSEO_USER_ID', 2);
        define('LSEO_PAGE_IDS', array(3, 4));
        define('DISABLE_WP_CRON', true);
    volumes:
      - ./local-seo-publisher:/var/www/html/wp-content/plugins/local-seo-publisher:ro
    depends_on:
      - db
